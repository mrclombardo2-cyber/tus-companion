name = "tus-companion"
main = "src/index.js"
compatibility_date = "2026-09-29"
workers_dev = true

[assets]
directory = "../../frontend"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/health"]

[vars]
OPERATOR_NAME = "Independent TUS Companion project"
CONTACT_EMAIL = ""

# The D1 binding is added automatically by GO-LIVE.ps1 using:
# wrangler d1 create tus-companion-db --binding DB --update-config

[[d1_databases]]
binding = "DB"
database_name = "tus-companion-db"
database_id = "90e30285-63de-4f27-9b80-a1f7871864df"
