name = "tus-companion"
main = "src/index.js"
compatibility_date = "2026-09-30"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[assets]
directory = "../../frontend"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/health"]

[triggers]
crons = ["* * * * *"]

[browser]
binding = "BROWSER"

[[queues.producers]]
binding = "SYNC_QUEUE"
queue = "tus-companion-sync"

[[queues.consumers]]
queue = "tus-companion-sync"
max_batch_size = 1
max_batch_timeout = 1
max_retries = 5
max_concurrency = 2
retry_delay = 90

[vars]
OPERATOR_NAME = "Independent TUS Companion project"
CONTACT_EMAIL = ""

[[d1_databases]]
binding = "DB"
database_name = "tus-companion-db"
database_id = "90e30285-63de-4f27-9b80-a1f7871864df"
