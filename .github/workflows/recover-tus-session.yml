name: Recover TUS session once

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/recover-tus-session.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUD_API_URL: ${{ secrets.CLOUD_API_URL }}
      CLOUD_ADMIN_TOKEN: ${{ secrets.CLOUD_ADMIN_TOKEN }}
      SESSION_CIPHER_KEY_B64: ${{ secrets.SESSION_CIPHER_KEY_B64 }}
      VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
      VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
      TUS_PUSH_WORKERS: "4"
      PYTHONUNBUFFERED: "1"

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: cloud/collector/requirements.txt

      - name: Install recovery collector
        run: |
          pip install -r cloud/collector/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Attempt silent Microsoft/TUS session renewal
        shell: bash
        run: |
          set +e
          TUS_SYNC_SCOPE=hot python cloud/collector/run_cloud_sync.py
          code=$?
          set -e
          if [ "$code" -eq 1 ]; then
            echo "Silent session recovery failed."
            exit 1
          fi
          echo "Browser recovery completed with code $code."

      - name: Verify renewed session with the Cloudflare-native collector
        shell: bash
        run: |
          set -euo pipefail
          base="https://tus-companion.tusathlone.workers.dev"
          health="$(curl --fail --silent --show-error "$base/health")"
          printf '%s\n' "$health" | jq .
          error="$(printf '%s\n' "$health" | jq -r '.collector.source_session_error // ""')"
          if [ -n "$error" ]; then
            echo "Session error remains after browser recovery: $error"
            exit 1
          fi

          before="$(printf '%s\n' "$health" | jq -r '.collector.catalog_updated_at // ""')"
          curl --fail --silent --show-error -X POST             -H "x-admin-token: $CLOUD_ADMIN_TOKEN"             "$base/api/admin/run-catalog" | jq -e '.queued == true' >/dev/null

          for attempt in $(seq 1 18); do
            sleep 5
            current="$(curl --fail --silent --show-error "$base/health")"
            error="$(printf '%s\n' "$current" | jq -r '.collector.source_session_error // ""')"
            if [ -n "$error" ]; then
              echo "Cloudflare-native collector still reports: $error"
              exit 1
            fi
            after="$(printf '%s\n' "$current" | jq -r '.collector.catalog_updated_at // ""')"
            if [ -n "$after" ] && [ "$after" != "$before" ]; then
              echo "Cloudflare-native TUS refresh confirmed: $after"
              exit 0
            fi
            echo "Waiting for native collector ($attempt/18)..."
          done

          echo "Renewal succeeded, but native catalog refresh was not confirmed."
          exit 1
