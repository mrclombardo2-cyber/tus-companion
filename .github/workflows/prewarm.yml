name: Preload uncached timetables

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tus-companion-cloud-sync
  cancel-in-progress: false

jobs:
  prewarm:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUD_API_URL: ${{ secrets.CLOUD_API_URL }}
      CLOUD_ADMIN_TOKEN: ${{ secrets.CLOUD_ADMIN_TOKEN }}
      SESSION_CIPHER_KEY_B64: ${{ secrets.SESSION_CIPHER_KEY_B64 }}
      VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
      VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
      TUS_PUSH_WORKERS: "8"
      TUS_PRELOAD_MISSING: "1"
      TUS_PRELOAD_LIMIT: "40"
      PYTHONUNBUFFERED: "1"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: cloud/collector/requirements.txt
      - name: Install collector dependencies
        run: pip install -r cloud/collector/requirements.txt
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Preload the next uncached timetable batch
        shell: bash
        run: |
          set +e
          python cloud/collector/run_cloud_sync.py
          code=$?
          set -e
          if [ "$code" -eq 1 ]; then
            echo "Fatal preload error."
            exit 1
          fi
          if [ "$code" -eq 2 ]; then
            echo "Some timetable groups had transient errors; successful groups were still cached and the next run will retry the rest."
          fi
          exit 0
