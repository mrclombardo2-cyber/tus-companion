name: Keep TUS source session alive

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches: ["main"]
    paths:
      - "cloud/collector/keep_session_alive.py"
      - "cloud/worker/**"
      - ".github/workflows/session-keeper.yml"

permissions:
  contents: read

concurrency:
  group: tus-source-session-keeper
  cancel-in-progress: true

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUD_API_URL: https://tus-companion.tusathlone.workers.dev
      CLOUD_ADMIN_TOKEN: ${{ secrets.CLOUD_ADMIN_TOKEN }}
      SESSION_CIPHER_KEY_B64: ${{ secrets.SESSION_CIPHER_KEY_B64 }}

    steps:
      - name: Detect active approved delegated timetable source
        id: delegated
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl --fail --silent --show-error --max-time 15 "$CLOUD_API_URL/api/entraid/status" 2>/dev/null | jq -r '.mode // ""' 2>/dev/null || true)"
          health="$(curl --fail --silent --show-error --max-time 15 "$CLOUD_API_URL/health" 2>/dev/null | jq -r '.status // ""' 2>/dev/null || true)"
          if [ "$status" = "delegated-session-present" ] && [ "$health" = "ok" ]; then
            echo "Delegated source is already healthy on Cloudflare; no legacy browser-cookie keepalive needed."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Legacy cookie fallback may be needed; continuing usual session maintenance."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check required secrets
        if: steps.delegated.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          for name in CLOUD_ADMIN_TOKEN SESSION_CIPHER_KEY_B64; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required repository secret: $name"
              exit 1
            fi
          done

      - name: Checkout
        if: steps.delegated.outputs.skip != 'true'
        uses: actions/checkout@v6

      - name: Set up Python
        if: steps.delegated.outputs.skip != 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Cache Playwright browser
        if: steps.delegated.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-1.49.1

      - name: Install keepalive dependencies
        if: steps.delegated.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check             playwright==1.49.1             cryptography==44.0.0             httpx==0.28.1             beautifulsoup4==4.14.3
          python -m playwright install --with-deps chromium

      - name: Renew TUS/Microsoft session silently
        if: steps.delegated.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python cloud/collector/keep_session_alive.py
