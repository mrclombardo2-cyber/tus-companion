name: Diagnose Cloudflare v15.1

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/diagnose-cloudflare.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6

      - name: Resolve Cloudflare account
        id: cf
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          json="$(curl --fail --silent --show-error -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" https://api.cloudflare.com/client/v4/accounts)"
          id="$(printf '%s' "$json" | jq -r '.result[0].id // empty')"
          test -n "$id"
          echo "::add-mask::$id"
          echo "id=$id" >> "$GITHUB_OUTPUT"

      - name: Install Wrangler
        working-directory: cloud/worker
        run: npm install --ignore-scripts

      - name: Inspect live Worker and capture Queue consumer logs
        shell: bash
        working-directory: cloud/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.cf.outputs.id }}
          CLOUD_ADMIN_TOKEN: ${{ secrets.CLOUD_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          base="https://tus-companion.tusathlone.workers.dev"

          echo "=== HEALTH BEFORE ==="
          curl --fail --silent --show-error "$base/health" | jq .

          echo "=== SOURCE SESSION PRESENT ==="
          curl --fail --silent --show-error -H "x-admin-token: $CLOUD_ADMIN_TOKEN" "$base/api/admin/source-session"             | jq '{has_ciphertext:(.ciphertext != null and .ciphertext != ""),has_nonce:(.nonce != null and .nonce != ""),updated_at}'

          echo "=== QUEUE INFO ==="
          npx wrangler queues info tus-companion-sync || true

          echo "=== START TAIL ==="
          timeout 55s npx wrangler tail tus-companion --format pretty > /tmp/tail.log 2>&1 &
          tail_pid=$!
          sleep 7

          echo "=== ENQUEUE CATALOG ==="
          curl --fail --silent --show-error -X POST -H "x-admin-token: $CLOUD_ADMIN_TOKEN" "$base/api/admin/run-catalog" | jq .

          wait "$tail_pid" || true

          echo "=== TAIL OUTPUT ==="
          cat /tmp/tail.log || true

          echo "=== HEALTH AFTER ==="
          curl --fail --silent --show-error "$base/health" | jq .
