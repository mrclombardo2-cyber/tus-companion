name: Preload Business first, then all timetables

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/preload-all.yml"

permissions:
  contents: read

concurrency:
  group: tus-companion-cloud-sync
  cancel-in-progress: false

jobs:
  preload-all:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CLOUD_API_URL: ${{ secrets.CLOUD_API_URL }}
      CLOUD_ADMIN_TOKEN: ${{ secrets.CLOUD_ADMIN_TOKEN }}
      SESSION_CIPHER_KEY_B64: ${{ secrets.SESSION_CIPHER_KEY_B64 }}
      VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
      VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
      TUS_PUSH_WORKERS: "8"
      TUS_PRELOAD_MISSING: "1"
      PYTHONUNBUFFERED: "1"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: cloud/collector/requirements.txt
      - name: Install collector dependencies
        run: pip install -r cloud/collector/requirements.txt
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Phase 1 - preload Business timetables first
        shell: bash
        run: |
          set -uo pipefail
          for batch in $(seq 1 20); do
            echo "=== BUSINESS preload batch $batch ==="
            set +e
            output="$(TUS_PRELOAD_DEPARTMENT_MATCH=business TUS_PRELOAD_LIMIT=25 python cloud/collector/run_cloud_sync.py 2>&1)"
            code=$?
            set -e
            printf '%s\n' "$output"
            if [ "$code" -eq 1 ]; then
              echo "Fatal collector error during Business preload."
              exit 1
            fi
            if printf '%s\n' "$output" | grep -q "\[sync\] no active groups yet"; then
              echo "Business timetables are preloaded."
              break
            fi
            sleep 2
          done

      - name: Phase 2 - preload every remaining timetable
        shell: bash
        run: |
          set -uo pipefail
          for batch in $(seq 1 40); do
            echo "=== ALL preload batch $batch ==="
            set +e
            output="$(TUS_PRELOAD_LIMIT=40 python cloud/collector/run_cloud_sync.py 2>&1)"
            code=$?
            set -e
            printf '%s\n' "$output"
            if [ "$code" -eq 1 ]; then
              echo "Fatal collector error during full preload."
              exit 1
            fi
            if printf '%s\n' "$output" | grep -q "\[sync\] no active groups yet"; then
              echo "All currently catalogued timetables are preloaded."
              exit 0
            fi
            sleep 2
          done
          echo "Batch cap reached; scheduled preload will continue any remaining groups."
