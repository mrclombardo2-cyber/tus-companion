name: Deploy Cloudflare Worker v16.1.0

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "frontend/**"
      - "cloud/worker/**"
      - "tests/**"
      - "package.json"
      - "playwright.config.js"
      - ".github/workflows/deploy-cloudflare.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check Cloudflare and persistent app secrets
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUD_ADMIN_TOKEN: ${{ secrets.CLOUD_ADMIN_TOKEN }}
          SESSION_CIPHER_KEY_B64: ${{ secrets.SESSION_CIPHER_KEY_B64 }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_API_TOKEN CLOUD_ADMIN_TOKEN SESSION_CIPHER_KEY_B64 VAPID_PRIVATE_KEY VAPID_SUBJECT; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required repository secret: $name"
              exit 1
            fi
          done

      - name: Resolve Cloudflare account automatically
        id: cf-account
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          json="$(curl --fail --silent --show-error             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             -H "Content-Type: application/json"             https://api.cloudflare.com/client/v4/accounts)"
          account_id="$(printf '%s' "$json" | jq -r '.result[0].id // empty')"
          if [ -z "$account_id" ]; then
            echo "The token cannot resolve an accessible Cloudflare account."
            exit 1
          fi
          echo "::add-mask::$account_id"
          echo "account_id=$account_id" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v6

      - name: Derive VAPID public key from existing private key
        id: vapid
        shell: bash
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          pub="$(node - <<'NODE'
          const crypto = require('crypto');
          const raw = process.env.VAPID_PRIVATE_KEY || '';
          const pad = '='.repeat((4 - raw.length % 4) % 4);
          const priv = Buffer.from(raw.replace(/-/g, '+').replace(/_/g, '/') + pad, 'base64');
          if (priv.length !== 32) throw new Error('Invalid VAPID private key');
          const ecdh = crypto.createECDH('prime256v1');
          ecdh.setPrivateKey(priv);
          process.stdout.write(ecdh.getPublicKey().toString('base64url'));
          NODE
          )"
          echo "public_key=$pub" >> "$GITHUB_OUTPUT"

      - name: Setup Node for regression tests
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check deployment source
        shell: bash
        run: |
          set -euo pipefail
          node --check cloud/worker/src/index.js
          node --check cloud/worker/src/calendar.js
          node --check cloud/worker/src/scientia.js
          node --check cloud/worker/src/timetable.js
          node --check frontend/app.js
          node --check frontend/sw.js

      - name: Install regression-test dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Run unit and browser regression tests
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/calendar.test.mjs
          python3 -m http.server 4173 --directory frontend >/tmp/tus-companion-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 0.25
          done
          npx playwright test

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ steps.cf-account.outputs.account_id }}
          workingDirectory: cloud/worker
          wranglerVersion: "4.143.0"
          secrets: |
            ADMIN_TOKEN
            SESSION_CIPHER_KEY_B64
            VAPID_PUBLIC_KEY
            VAPID_PRIVATE_KEY
            VAPID_SUBJECT
          preCommands: |
            npm install --ignore-scripts
            wrangler queues info tus-companion-sync >/dev/null 2>&1 || wrangler queues create tus-companion-sync
          command: deploy
        env:
          ADMIN_TOKEN: ${{ secrets.CLOUD_ADMIN_TOKEN }}
          SESSION_CIPHER_KEY_B64: ${{ secrets.SESSION_CIPHER_KEY_B64 }}
          VAPID_PUBLIC_KEY: ${{ steps.vapid.outputs.public_key }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}

      - name: Verify live worker and recovery
        shell: bash
        run: |
          set -euo pipefail
          base="https://tus-companion.tusathlone.workers.dev"

          echo "Waiting for the newly deployed Worker version to propagate..."
          health=""
          version_ok=false
          for attempt in $(seq 1 12); do
            health="$(curl --fail --silent --show-error "$base/health")"
            live_version="$(printf '%s\n' "$health" | jq -r '.version // ""')"
            if [ "$live_version" = "1.9.0-cloud" ]; then
              version_ok=true
              break
            fi
            echo "Waiting for version propagation ($attempt/12), live=$live_version..."
            sleep 5
          done
          if [ "$version_ok" != "true" ]; then
            echo "The new Worker version did not propagate within 60 seconds."
            exit 1
          fi

          before="$(printf '%s\n' "$health" | jq -r '.collector.last_cycle_finished_at // ""')"

          echo "Checking public catalog..."
          curl --fail --silent --show-error "$base/api/catalog" | jq -e '.departments | length > 0' >/dev/null

          echo "Waiting for scheduler and automatic source-session recovery..."
          ok=false
          for attempt in $(seq 1 36); do
            sleep 5
            current="$(curl --fail --silent --show-error "$base/health")"
            after="$(printf '%s\n' "$current" | jq -r '.collector.last_cycle_finished_at // ""')"
            source_error="$(printf '%s\n' "$current" | jq -r '.collector.source_session_error // ""')"
            manual_required="$(printf '%s\n' "$current" | jq -r '.collector.source_browser_manual_required_at // ""')"
            if [ -n "$after" ] && [ "$after" != "$before" ] && [ -z "$source_error" ]; then
              echo "Scheduler/recovery confirmed: $after"
              ok=true
              break
            fi
            if [ -n "$manual_required" ]; then
              echo "Automatic recovery reached Microsoft interactive-login/MFA state."
              break
            fi
            echo "Waiting for scheduler/recovery ($attempt/36), source_error=$source_error..."
          done

          if [ "$ok" != "true" ]; then
            echo "The Worker deployed, but healthy scheduler/source-session state was not confirmed."
            curl --silent --show-error "$base/health" | jq .
            exit 1
          fi

          echo "Cloudflare live verification passed."
