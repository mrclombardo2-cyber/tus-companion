name: Deploy Cloudflare Worker

# Deploys current main to Cloudflare.
# Secrets configured; trigger deploy
# Worker token scope updated; trigger deploy

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "frontend/**"
      - "cloud/worker/**"
      - ".github/workflows/deploy-cloudflare.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check Cloudflare token
        shell: bash
        env:
          HAS_CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        run: |
          echo "CLOUDFLARE_API_TOKEN configured: $HAS_CF_TOKEN"
          if [ "$HAS_CF_TOKEN" != "true" ]; then
            echo "Missing CLOUDFLARE_API_TOKEN repository secret."
            exit 1
          fi

      - name: Resolve Cloudflare account automatically
        id: cf-account
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          json="$(curl --fail --silent --show-error             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             -H "Content-Type: application/json"             https://api.cloudflare.com/client/v4/accounts)"
          account_id="$(printf '%s' "$json" | jq -r '.result[0].id // empty')"
          if [ -z "$account_id" ]; then
            echo "The token cannot resolve an accessible Cloudflare account."
            exit 1
          fi
          echo "::add-mask::$account_id"
          echo "account_id=$account_id" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v6

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ steps.cf-account.outputs.account_id }}
          workingDirectory: cloud/worker
          command: deploy
