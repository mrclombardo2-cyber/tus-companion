#:schema https://developers.openai.com/codex/config-schema.json

# TUS Companion project-local Codex policy.
# Model selection is intentionally not pinned so the user's current Codex model
# and future supported defaults can be used without repository churn.

approval_policy = "on-request"
sandbox_mode = "workspace-write"
web_search = "live"
persistent_instructions = "Follow the repository AGENTS.md exactly. Prefer minimal, reversible diffs. Treat deploys, merges to main, production data changes, Cloudflare resource changes, and secret changes as external actions requiring explicit user approval."

[features]
multi_agent = true

[agents]
max_threads = 4
max_depth = 1

[agents.explorer]
description = "Read-only TUS Companion codebase explorer. Trace the real execution path and gather evidence before edits."
config_file = "agents/explorer.toml"

[agents.reviewer]
description = "Read-only owner-level reviewer for correctness, security, regressions, Cloudflare behavior, PWA caching and missing tests."
config_file = "agents/reviewer.toml"

[agents.docs_researcher]
description = "Read-only primary-documentation researcher for Cloudflare, Playwright, GitHub Actions, browser/PWA and other changing APIs."
config_file = "agents/docs-researcher.toml"
